[workspace]
authors = ["Konstantinos Kyriakidis <kkyriaki@ucsc.edu>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
description = "Fast partial order alignment (POA) of DNA in Mojo: multiple sequence alignment and consensus"
name = "plegma"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.1.0"
license = "MIT"
license-file = "LICENSE"

# Latest Mojo (nightly channel): the vendored Modular skills track the latest compiler.
[dependencies]
# Pinned: nightlies change the language from day to day. Move it on purpose, rebuild and test.
mojo = "==1.2.0.dev2026102005"
# karan's GPU paths import max.gpu and max.algorithm; the max nightly of the same day.
max = "==26.7.0.dev2026102005"
# sporos: libdeflate reads gzip/BGZF, libsais builds its FM-index (dlopen).
libdeflate = ">=1.26,<2"
libsais = ">=2.12,<3"

[tasks]
# `mojo build -o` writes into a directory but will not create one.
prepare = "mkdir -p build"
# The submodules deps/sporos (seeds: MUMs, SMEMs) and deps/karan (pairwise alignment) are on every include path.
build = { cmd = "mojo precompile -I deps/sporos -I deps/karan plegma -o build/plegma.mojoc", depends-on = ["prepare"] }
build-test-alphabet = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_alphabet.mojo -o build/test_alphabet", depends-on = ["prepare"] }
build-test-deps = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_deps.mojo -o build/test_deps", depends-on = ["prepare"] }
build-test-chain = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_chain.mojo -o build/test_chain", depends-on = ["prepare"] }
build-test-graph = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_graph.mojo -o build/test_graph", depends-on = ["prepare"] }
build-test-kernel = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_kernel.mojo -o build/test_kernel", depends-on = ["prepare"] }
build-test-polish = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_polish.mojo -o build/test_polish", depends-on = ["prepare"] }
test = { cmd = "./build/test_alphabet && ./build/test_deps && ./build/test_chain && ./build/test_graph && ./build/test_kernel && ./build/test_polish", depends-on = ["build-test-alphabet", "build-test-deps", "build-test-chain", "build-test-graph", "build-test-kernel", "build-test-polish"] }
# The pairwise experiments E1-E5 (experiments/pairwise): `pixi run pairwise-run <vntr-eval>/regions <out dir> [jobs]`.
# The command line, abPOA's flags: `pixi run build-cli`, then `build/plegma -h`.
build-cli = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan cli/plegma_cli.mojo -o build/plegma", depends-on = ["prepare"] }
# Random inputs through every option combination, every output checked: `pixi run fuzz [cases] [seed]`.
fuzz = { cmd = "python3 -I experiments/validate/fuzz.py build/plegma build/fuzz", depends-on = ["build-cli"] }
build-progressive = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan experiments/progressive/progressive.mojo -o build/progressive", depends-on = ["prepare"] }
# Seeding strategies against true and optimal pairwise alignments (experiments/seeding).
build-seeding = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan experiments/seeding/seeding.mojo -o build/seeding", depends-on = ["prepare"] }
build-pairwise = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan experiments/pairwise/pairwise.mojo -o build/pairwise", depends-on = ["prepare"] }
format = "mojo format -l 120 plegma tests experiments cli"
# Pulls the latest Mojo skills from github.com/modular/skills into .claude/skills for coding agents.
sync-skills = "bash .claude/sync-skills.sh"
