[workspace]
authors = ["Konstantinos Kyriakidis <kkyriaki@ucsc.edu>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
description = "Fast partial order alignment (POA) of DNA in Mojo: multiple sequence alignment and consensus"
name = "plegma"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
version = "0.4.0"
license = "MIT"
license-file = "LICENSE"

# Latest Mojo (nightly channel): the vendored Modular skills track the latest compiler.
[dependencies]
# Pinned: nightlies change the language from day to day. Move it on purpose, rebuild and test.
mojo = "==1.3.0.dev2026112705"
# karan's GPU paths import max.gpu and max.algorithm; the max nightly of the same day.
max = "==26.8.0.dev2026112705"
# sporos: libdeflate reads gzip/BGZF, libsais builds its FM-index (dlopen).
libdeflate = ">=1.25,<2"
libsais = ">=2.12,<3"

[tasks]
# `mojo build -o` writes into a directory but will not create one.
prepare = "mkdir -p build"
# The submodules deps/sporos (FASTA/FASTQ reading) and deps/karan (pairwise alignment) are on every include path.
build = { cmd = "mojo precompile -I deps/sporos -I deps/karan plegma -o build/plegma.mojoc", depends-on = ["prepare"] }
build-test-alphabet = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_alphabet.mojo -o build/test_alphabet", depends-on = ["prepare"] }
build-test-cigar = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_cigar.mojo -o build/test_cigar", depends-on = ["prepare"] }
build-test-deps = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_deps.mojo -o build/test_deps", depends-on = ["prepare"] }
build-test-graph = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_graph.mojo -o build/test_graph", depends-on = ["prepare"] }
build-test-topology-simd = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_topology_simd.mojo -o build/test_topology_simd", depends-on = ["prepare"] }
build-test-kernel = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_kernel.mojo -o build/test_kernel", depends-on = ["prepare"] }
build-test-seeds-chain = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_seeds_chain.mojo -o build/test_seeds_chain", depends-on = ["prepare"] }
build-test-homopolymer = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_homopolymer.mojo -o build/test_homopolymer", depends-on = ["prepare"] }
build-test-order-clusters = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_order_clusters.mojo -o build/test_order_clusters", depends-on = ["prepare"] }
build-test-clustered = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_clustered.mojo -o build/test_clustered", depends-on = ["prepare"] }
build-test-polish = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_polish.mojo -o build/test_polish", depends-on = ["prepare"] }
build-test-bands-runs = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_bands_runs.mojo -o build/test_bands_runs", depends-on = ["prepare"] }
build-test-pinned = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_pinned.mojo -o build/test_pinned", depends-on = ["prepare"] }
build-test-anchored-join = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_anchored_join.mojo -o build/test_anchored_join", depends-on = ["prepare"] }
build-test-poa = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_poa.mojo -o build/test_poa", depends-on = ["prepare"] }
build-test-reference = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_reference.mojo -o build/test_reference", depends-on = ["prepare"] }
build-test-parallel-scratch = { cmd = "mojo build -I . -I deps/sporos -I deps/karan -I tests tests/test_parallel_scratch.mojo -o build/test_parallel_scratch", depends-on = ["prepare"] }
test = { cmd = "./build/test_alphabet && ./build/test_cigar && ./build/test_deps && ./build/test_graph && ./build/test_topology_simd && ./build/test_kernel && ./build/test_seeds_chain && ./build/test_polish && ./build/test_bands_runs && ./build/test_order_clusters && ./build/test_clustered && ./build/test_homopolymer && ./build/test_pinned && ./build/test_anchored_join && ./build/test_poa && ./build/test_reference && ./build/test_parallel_scratch", depends-on = ["build-test-poa", "build-test-clustered", "build-test-alphabet", "build-test-cigar", "build-test-deps", "build-test-graph", "build-test-topology-simd", "build-test-kernel", "build-test-seeds-chain", "build-test-polish", "build-test-bands-runs", "build-test-order-clusters", "build-test-homopolymer", "build-test-pinned", "build-test-anchored-join", "build-test-reference", "build-test-parallel-scratch"] }
# The command line, `plegma poa` (abPOA's flags) and `plegma ref`: `pixi run build-cli`, then `build/plegma -h`.
build-cli = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan cli/plegma_cli.mojo -o build/plegma", depends-on = ["prepare"] }
# The C API (capi/plegma.h, capi/plegma.hpp): build/libplegma.so, and its tests against it.
build-capi = { cmd = "mojo build --emit shared-lib -D ASSERT=none -I . -I deps/sporos -I deps/karan -Xlinker -rpath -Xlinker '$ORIGIN' capi/plegma_capi.mojo -o build/libplegma.so && bash capi/bundle_runtime.sh", depends-on = ["prepare"] }
build-test-capi = { cmd = "c++ -std=c++17 -O2 -Icapi capi/test_capi.cpp -Lbuild -lplegma -Wl,-rpath,$PIXI_PROJECT_ROOT/build -pthread -o build/test_capi", depends-on = ["build-capi"] }
test-capi = { cmd = "./build/test_capi", depends-on = ["build-test-capi"] }
# The static library: build/libplegma.a, the C API with the Mojo runtime functions it calls (capi/build_static.sh),
# for static executables; built for x86-64-v3 on x86-64 (PLEGMA_TARGET_CPU chooses another). Linux.
build-static = { cmd = "bash capi/build_static.sh", depends-on = ["prepare"] }
build-test-static = { cmd = "c++ -std=c++17 -O2 -static -Icapi capi/test_capi.cpp build/libplegma.a -pthread -o build/test_capi_static && mojo build --emit object -D ASSERT=none -I . -I deps/sporos -I deps/karan capi/test_static_parallel.mojo -o build/test_static_parallel.o && cc -O2 -static capi/test_static_parallel.c build/test_static_parallel.o build/plegma_static_runtime.o -lm -pthread -o build/test_static_parallel", depends-on = ["build-static"] }
test-static = { cmd = "./build/test_capi_static && MALLOC_CHECK_=3 ./build/test_static_parallel", depends-on = ["build-test-static"] }
test-python = { cmd = "python3 python/test_plegma.py", depends-on = ["build-capi"] }
# Random inputs through every option combination, every output checked: `pixi run fuzz [cases] [seed]`.
fuzz = { cmd = "python3 -I experiments/validate/fuzz.py build/plegma build/fuzz", depends-on = ["build-cli"] }
# Everything a release is checked with: the unit tests, the C API (shared and static), Python, and the fuzzer.
test-all = { cmd = "python3 -I experiments/validate/fuzz.py build/plegma build/fuzz 300", depends-on = ["test", "test-capi", "test-static", "test-python", "build-cli"] }
# The co-optimal letter pairs experiments/chr20/qc_loop.py --coopt scores against.
build-coopt = { cmd = "mojo build -D ASSERT=none -I . -I deps/sporos -I deps/karan experiments/chr20/coopt.mojo -o build/coopt", depends-on = ["prepare"] }
format = "mojo format -l 120 plegma tests experiments cli capi"
# Pulls the latest Mojo skills from github.com/modular/skills into .claude/skills for coding agents.
sync-skills = "bash .claude/sync-skills.sh"
